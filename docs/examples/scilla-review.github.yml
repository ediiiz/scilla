# Proposes reviewed updates for a scilla Collection: when a Reference that scilla-review.json
# reviews has moved upstream, it opens (or updates) a pull request that bumps its reviewed commit,
# with the per-skill changes in the body. Merging the pull request releases the update to
# Consumers. See `scilla docs review`.
#
# Copy this file to .github/workflows/scilla-review.yml in your Collection's repo. Run
# `scilla review accept` once and commit scilla-review.json first: References without a reviewed
# commit float and are never proposed.
#
# Pull requests opened with GITHUB_TOKEN don't start other workflows. If your CI should run on
# them, store a GitHub App or fine-grained personal token as SCILLA_REVIEW_TOKEN.
# References to private repos need git credentials here too (for example a deploy key).
name: Review upstream skills

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # push the scilla/review-updates branch
  pull-requests: write # open or update its pull request

concurrency:
  group: scilla-review
  cancel-in-progress: false

jobs:
  propose:
    name: Propose reviewed updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Set the identity of the review commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Open or update the pull request
        run: bunx scilla-cli review propose --open
        env:
          GITHUB_TOKEN: ${{ secrets.SCILLA_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
